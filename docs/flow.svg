<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" role="img" aria-label="一轮对话：心率和你按的反馈进提示词，你自己的模型在回复里写动作，经过安全关后驱动玩具，身体的反应和你的操作进入下一轮">
  <defs>
    <marker id="mn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8696"/></marker>
    <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d6455d"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c8f82"/></marker>
    <marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8741a"/></marker>
  </defs>

  <!-- 底卡：浅色实底，GitHub 深浅主题都能读 -->
  <rect x="1" y="1" width="998" height="518" rx="20" fill="#fbfafc" stroke="#e2dfe8" stroke-width="1.5"/>

  <text x="50" y="52" fill="#24212c" font-size="22" font-weight="700">一轮对话里发生了什么</text>
  <text x="50" y="80" fill="#5d5a68" font-size="13">heartlink 只管连得稳、注得准、停得下；读懂剧情、决定强弱的是你自己的模型</text>

  <!-- 上排：数据进模型（左 → 右） -->
  <g text-anchor="middle">
    <rect x="50" y="112" width="180" height="96" rx="12" fill="#fbe9ec" stroke="#d6455d" stroke-width="1.5"/>
    <text x="140" y="148" fill="#a8293f" font-size="16" font-weight="700">心率设备</text>
    <text x="140" y="174" fill="#5d5a68" font-size="13">手环、心率带</text>
    <text x="140" y="194" fill="#5d5a68" font-size="13">每秒一个心率</text>

    <rect x="290" y="112" width="180" height="96" rx="12" fill="#f1eff5" stroke="#c9c4d3" stroke-width="1.5"/>
    <text x="380" y="148" fill="#24212c" font-size="16" font-weight="700">heartlink 整理</text>
    <text x="380" y="174" fill="#5d5a68" font-size="13">心率按相位切段</text>
    <text x="380" y="194" fill="#5d5a68" font-size="13">记下你的操作，不下结论</text>

    <rect x="530" y="112" width="180" height="96" rx="12" fill="#fbfafc" stroke="#8a8696" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="620" y="148" fill="#24212c" font-size="16" font-weight="700">你自己的模型</text>
    <text x="620" y="174" fill="#5d5a68" font-size="13">读剧情、心率和反馈</text>
    <text x="620" y="194" fill="#5d5a68" font-size="13">决定写不写动作</text>

    <rect x="770" y="112" width="180" height="96" rx="12" fill="#f1eff5" stroke="#c9c4d3" stroke-width="1.5"/>
    <text x="860" y="148" fill="#24212c" font-size="16" font-weight="700">回复里的动作</text>
    <text x="860" y="174" fill="#1c6f66" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;bio_act/&gt;</text>
    <text x="860" y="194" fill="#5d5a68" font-size="13">回复写完才解析</text>
  </g>

  <!-- 下排：动作到玩具（右 → 左） -->
  <g text-anchor="middle">
    <rect x="770" y="300" width="180" height="96" rx="12" fill="#f1eff5" stroke="#c9c4d3" stroke-width="1.5"/>
    <text x="860" y="336" fill="#24212c" font-size="16" font-weight="700">安全关</text>
    <text x="860" y="362" fill="#5d5a68" font-size="13">开关、节奏、间隔</text>
    <text x="860" y="382" fill="#5d5a68" font-size="13">有风险的输出要点名</text>

    <rect x="530" y="300" width="180" height="96" rx="12" fill="#f1eff5" stroke="#c9c4d3" stroke-width="1.5"/>
    <text x="620" y="336" fill="#24212c" font-size="16" font-weight="700">Intiface / 浏览器</text>
    <text x="620" y="362" fill="#5d5a68" font-size="13">推荐 Intiface</text>
    <text x="620" y="382" fill="#5d5a68" font-size="13">浏览器直连是测试版</text>

    <rect x="290" y="300" width="180" height="96" rx="12" fill="#e3f3f0" stroke="#1c8f82" stroke-width="1.5"/>
    <text x="380" y="336" fill="#136a60" font-size="16" font-weight="700">玩具</text>
    <text x="380" y="362" fill="#5d5a68" font-size="13">跟着剧情动起来</text>

    <rect x="50" y="300" width="180" height="96" rx="12" fill="#fbe9ec" stroke="#d6455d" stroke-width="1.5"/>
    <text x="140" y="336" fill="#a8293f" font-size="16" font-weight="700">你</text>
    <text x="140" y="362" fill="#5d5a68" font-size="13">心跳跟着变</text>
    <text x="140" y="382" fill="#5d5a68" font-size="13">也可以按停、调强弱</text>
  </g>

  <!-- 箭头：心率红、动作青、你的反馈琥珀、其它中性 -->
  <g fill="none" stroke-width="2">
    <line x1="233" y1="160" x2="286" y2="160" stroke="#d6455d" marker-end="url(#mh)"/>
    <line x1="473" y1="160" x2="526" y2="160" stroke="#8a8696" marker-end="url(#mn)"/>
    <line x1="713" y1="160" x2="766" y2="160" stroke="#8a8696" marker-end="url(#mn)"/>
    <line x1="860" y1="211" x2="860" y2="296" stroke="#1c8f82" marker-end="url(#mt)"/>
    <line x1="767" y1="348" x2="714" y2="348" stroke="#1c8f82" marker-end="url(#mt)"/>
    <line x1="527" y1="348" x2="474" y2="348" stroke="#1c8f82" marker-end="url(#mt)"/>
    <line x1="287" y1="348" x2="234" y2="348" stroke="#8a8696" marker-end="url(#mn)"/>
    <line x1="140" y1="297" x2="140" y2="212" stroke="#d6455d" marker-end="url(#mh)"/>
    <!-- 你的反馈：玩具页按钮 → heartlink 记下，下一轮一起发给模型 -->
    <path d="M212 297 C240 262 300 250 330 212" stroke="#b8741a" stroke-dasharray="6 4" marker-end="url(#mf)"/>
  </g>
  <g font-size="13" fill="#5d5a68" text-anchor="middle">
    <text x="260" y="150">每秒</text>
    <text x="500" y="150">按发送</text>
    <text x="740" y="150">写回复</text>
    <text x="740" y="338">放行</text>
    <text x="500" y="338">驱动</text>
    <text x="260" y="338">感受</text>
  </g>
  <g font-size="13">
    <text x="872" y="259" fill="#5d5a68">解析动作</text>
    <text x="128" y="259" fill="#5d5a68" text-anchor="end">进入下一轮</text>
    <text x="276" y="268" fill="#8a5410">你的反馈</text>
  </g>

  <!-- 底部说明 -->
  <line x1="50" y1="430" x2="950" y2="430" stroke="#e2dfe8" stroke-width="1"/>
  <g font-size="13">
    <rect x="50" y="448" width="76" height="26" rx="6" fill="#c4453d"/>
    <text x="88" y="466" fill="#ffffff" font-weight="700" text-anchor="middle">全部停止</text>
    <text x="138" y="466" fill="#24212c">随时可用，不经过模型</text>
    <text x="50" y="500" fill="#5d5a68">剧情联动默认关，你打开才会动</text>

    <line x1="486" y1="461" x2="516" y2="461" stroke="#d6455d" stroke-width="2"/>
    <text x="524" y="466" fill="#5d5a68">心率数据</text>
    <line x1="596" y1="461" x2="626" y2="461" stroke="#1c8f82" stroke-width="2"/>
    <text x="634" y="466" fill="#5d5a68">玩具动作</text>
    <line x1="706" y1="461" x2="736" y2="461" stroke="#b8741a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="744" y="466" fill="#5d5a68">你的反馈</text>
    <rect x="818" y="452" width="30" height="18" rx="4" fill="none" stroke="#8a8696" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="856" y="466" fill="#5d5a68">你的模型</text>
    <text x="950" y="500" fill="#5d5a68" text-anchor="end">灰色方框由 heartlink 负责</text>
  </g>
</svg>
